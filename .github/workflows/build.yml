name: Build Static App
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: NODE_OPTIONS="--max-old-space-size=6144" bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-output
          path: .output/public
